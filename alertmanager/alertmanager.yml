global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "webhook"
  routes:
    - match:
        severity: critical
      receiver: "webhook"
      repeat_interval: 5m
    - match:
        severity: warning
      receiver: "webhook"
      repeat_interval: 30m

receivers:
  - name: "webhook"
    webhook_configs:
      - url: "http://flask-app:5000/webhook/alert"
        send_resolved: true

